# 配置说明见主题文档
# 个人信息请在站点根目录的 _config.AomeNero.yml 中覆盖（Hexo 5+ 官方机制），此处保持可分发的干净默认值
# 博客配置
build_on_generate: false # 设 true 时 hexo generate/server 自动编译主题前端(需先在主题目录安装依赖);发布包用户保持 false 即可
keywords: Blog,博客,Hexo
author: # 作者名，用于版权声明等；留空则不显示
description: # 侧栏站点描述；留空则不显示
defaultTheme: default # 可选 light、dark 或 default

# 图标
# 如果尺寸不对,请直接替换 source/images/favicon.webp(主题不再使用 Stylus)
favicon: /images/favicon.webp
avatar: /images/logo.webp
logo_dir: /images/logo@2x.webp
asset_version: 15 # 修改 bundle.js/css 后递增,用于强制浏览器刷新缓存

# 字体配置（enable: false 时使用主题内置 Open Sans 方案）
font:
  enable: false
  # 全局字体（body 基础），size 同时作为全站 rem 的基准
  global:
    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif'
    size: 16px
    line_height: 1.8
  # 标题字体（全站 h1~h6）
  headings:
    family: '-apple-system, BlinkMacSystemFont, "Segoe UI","PingFang SC", "Hiragino Sans GB", "Microsoft YaHei","Noto Sans CJK SC", "Source Han Sans SC", sans-serif'
    line_height: 1.3
    h1_size: 32px
    h2_size: 26px
    h3_size: 22px
    h4_size: 18px
    h5_size: 16px
    h6_size: 14px
  # 导航菜单
  nav:
    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'
    size: 15px
    letter_spacing: 0.02em
  # 文章页（覆盖全局）
  post:
    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif'
    size: 17px
    line_height: 1.8
    title_size: 26px
  # 代码块 / 行内代码
  code:
    family: '"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace'
    size: 14px

# 全站版权设置
copyright:
  # 若 `show` 设为 true,会在每篇文章底部添加版权声明。也可在单篇文章的 front-matter 中单独设置。详见文档
  # 例如:
  # ---
  # title: 文章标题
  # copyright: "保留所有权利"
  # author: "张三、李四"
  # ---
  # ---
  # title: 文章标题
  # copyright: disabled
  # ---
  show: true
  # 默认版权声明
  default: ''
  # 是否在版权声明中显示文章作者
  show_author: true

# 站点页脚
footbar:
  # 版权声明,也可用作页脚备注
  copyright: # 如「采用 CC BY-NC-SA 4.0 许可，转载请注明出处.」
  # 对于中国用户，如果你有网站备案（备案号绑定域名,切勿使用他人的备案号）：
  beian: # 如 鄂ICP备12345678号
  gongan: # 公安备案号,需同时保留主题 images/gongan.png

# 社交链接
# 键是 font-awesome 6 的图标名,值是对应链接
# mail 除外。
social:
  github: # https://github.com/你的用户名
  mail: # your@mail.com
  zhihu:
  qq:
  twitter:
  instagram:
  rss:
  facebook:
  weibo:

# 导航菜单
menu:
  Home: /
  Archives: /archives
  Tags: /tags
  About: /about
  Links: /links

# 导航栏右侧按钮
rightbtn:
  back: true
  search: true # 搜索框代码感谢 Icarus
  avatar: true
  darkLightToggle: true # 明暗主题切换开关

# 其他设置
useSummary: false # 开启后将使用自动生成的摘要,而非你配置的 <!-- more --> 来预览文章

useTagCloud: true # 使用标签云代替标签列表
tocMaxDepth: 6 # 设为 0 则不生成目录(toc),最大为 6
banner_radius: 10px # 文章 banner 圆角;设为 0 恢复直角,支持任意 CSS 长度

# 评论
always_enable_comments: false # 始终启用评论

duoshuo:
disqus:
gentie:
# Valine 评论 https://valine.js.org
valine:
  enable: false # 如需使用 Valine,请设为 true 并填入 appid/appkey(空凭据会渲染出不可用的评论框)
  appid: # 你的 leancloud appid
  appkey: # 你的 leancloud appkey
  notify: false # true/false:邮件通知 !!!测试,谨慎使用。 https://github.com/xCss/Valine/wiki/Valine-%E8%AF%84%E8%AE%BA%E7%B3%BB%E7%BB%9F%E4%B8%AD%E7%9A%84%E9%82%AE%E4%BB%B6%E6%8F%90%E9%86%92%E8%AE%BE%E7%BD%AE
  verify: false # true/false:验证码
  avatar: mm # 头像样式 https://github.com/xCss/Valine/wiki/avatar-setting-for-valine
  placeholder: hello, world # 评论框占位文字
gitment:
  enable: false
  owner: 'Your GitHub ID'
  repo: 'Repo to store comments'
  client_id: 'Your client ID'
  client_secret: 'Your client secret'
gitalk:
  enable: false
  owner: 'Your GitHub ID'
  repo: 'Repo to store comments'
  client_id: 'Your client ID'
  client_secret: 'Your client secret'

# Giscus 评论(基于 GitHub Discussions) https://giscus.app
# 需公开仓库 + 开启 Discussions + 安装 giscus app,参数在 giscus.app 生成
giscus:
  enable: false
  repo: # 如 '你的用户名/仓库名'(建议独立评论仓库)
  repo_id: # giscus.app 生成
  category: Announcements
  category_id: # giscus.app 生成
  mapping: pathname # pathname/url/title/og:title 等,见 giscus 文档
  reactions_enabled: 1 # 评论表情反应
  input_position: bottom # 评论框位置 top/bottom
  theme: # light/dark/preferred_color_scheme 或自定义 CSS 地址;留空则跟随站点明暗切换
  lang: zh-CN

# 百度统计设置
# 请访问 https://tongji.baidu.com/
# 获取统计 JS 代码放入 AomeNero/source/js/baidu-tongji.js
Baidutongji: false
