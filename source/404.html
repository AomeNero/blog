<style>
:root{--bg:#fff;--fg:#282828;--muted:#8a8a8a;--accent:#4786d6;--num:rgba(71,134,214,.32);--btn-bg:#fff}
html[data-theme=dark]{--bg:#161616;--fg:#eee;--muted:#7a7a7a;--accent:#b5ceff;--num:rgba(181,206,255,.28);--btn-bg:#161616}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:18px;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
transition:background .8s,color .8s;overflow:hidden}
a{color:inherit;text-decoration:none}
.site{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:1px;color:var(--muted)}
.stage{position:relative;width:min(64vw,340px);height:min(64vw,340px);display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.code{position:absolute;font-size:min(34vw,180px);font-weight:800;line-height:1;letter-spacing:.14em;margin-right:-.14em; /* 抵消 letter-spacing 尾随空隙,保证字形真正居中 */
color:transparent;-webkit-text-stroke:3px var(--num);pointer-events:none;font-variant-numeric:tabular-nums}
svg{position:relative;width:62%;height:62%;overflow:visible}
.idle,.breath{transform-box:fill-box;transform-origin:center}
.breath{animation:breathe 3.4s ease-in-out infinite alternate}
.idle-shake{animation:摇头 2.8s ease-in-out infinite}
.idle-sway{animation:sway 4.2s ease-in-out infinite}
.body{fill:#2f86ed}.eye{fill:#fffdf7}
.act{transform-box:fill-box;transform-origin:center}
.act-bounce{animation:act-bounce .75s cubic-bezier(.3,.8,.4,1)}
.act-shake{animation:act-shake .65s ease}
.act-squish{animation:act-squish .8s ease}
h1{font-size:26px;font-weight:700;letter-spacing:2px}
.desc{color:var(--muted);font-size:15px;line-height:1.7;max-width:34em}
.btn{display:inline-block;margin-top:6px;padding:9px 26px;border:1.5px solid var(--accent);border-radius:999em;
color:var(--accent);background:var(--btn-bg);font-size:15px;cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:var(--accent);color:var(--bg)}
.foot{position:fixed;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.02)}}
@keyframes 摇头{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}}
@keyframes sway{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(5deg) translateY(4px)}60%{transform:rotate(-5deg) translateY(2px)}}
@keyframes act-bounce{0%,100%{transform:translateY(0) scale(1)}38%{transform:translateY(-30px) scale(.95,1.05)}60%{transform:translateY(3px) scale(1.08,.9)}}
@keyframes act-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg)}40%{transform:rotate(13deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
@keyframes act-squish{0%,100%{transform:scale(1)}30%{transform:scale(1.15,.72) translateY(20px)}60%{transform:scale(.86,1.18) translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.breath,.idle-shake,.idle-sway,.act-bounce,.act-shake,.act-squish{animation:none}}
